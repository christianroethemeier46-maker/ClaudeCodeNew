<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Würfel-Roller</title>
<style>
  :root {
    --bg: #14121f; --panel: #1f1c30; --panel2: #2a2640; --text: #ece9fa; --muted: #9a94b8;
    --accent: #f5b83d; --accent2: #8b5cf6; --good: #4ade80; --bad: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: radial-gradient(ellipse at top, #251f3f, var(--bg) 60%);
    color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 960px; margin: 0 auto; padding: 16px; }
  h1 { text-align: center; margin: 8px 0 16px; letter-spacing: .04em; }
  h1 span { color: var(--accent); }
  .panel { background: var(--panel); border-radius: 16px; padding: 16px; margin-bottom: 16px; box-shadow: 0 6px 24px #0006; }
  h2 { margin: 0 0 12px; font-size: 1rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }

  .picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
  .pick { background: var(--panel2); border-radius: 12px; padding: 10px 8px; text-align: center; border: 2px solid transparent; transition: border-color .2s; }
  .pick.active { border-color: var(--accent); }
  .pick svg { width: 48px; height: 48px; }
  .pick .name { font-weight: 700; margin: 2px 0 6px; }
  .stepper { display: flex; align-items: center; justify-content: center; gap: 6px; }
  .stepper button {
    width: 32px; height: 32px; border-radius: 50%; border: 0; font-size: 1.2rem; font-weight: 700;
    background: var(--accent2); color: #fff; cursor: pointer;
  }
  .stepper button:hover { filter: brightness(1.15); }
  .stepper button:active { transform: scale(.92); }
  .stepper output { min-width: 28px; font-size: 1.15rem; font-weight: 700; }

  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-top: 14px; }
  .mod { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .mod .stepper output { color: var(--text); }
  .formula { font-family: ui-monospace, monospace; color: var(--accent); min-height: 1.4em; }
  .btns { display: flex; gap: 8px; }
  button.main, button.sub {
    border: 0; border-radius: 12px; padding: 12px 22px; font-size: 1.05rem; font-weight: 700; cursor: pointer;
  }
  button.main { background: linear-gradient(135deg, var(--accent), #e8932b); color: #231a05; }
  button.sub { background: var(--panel2); color: var(--text); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.main:not(:disabled):hover { filter: brightness(1.1); }

  .stage {
    min-height: 220px; display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-items: center;
    padding: 12px; border-radius: 12px; background: radial-gradient(ellipse at center, #2f6b4a, #1d4a33 75%);
    box-shadow: inset 0 0 40px #0008; perspective: 700px; overflow: hidden;
  }
  .stage .placeholder { color: #cfe9da; opacity: .7; }
  .die { width: 76px; height: 76px; position: relative; transform-style: preserve-3d; filter: drop-shadow(0 8px 6px #0006); }
  .die svg { width: 100%; height: 100%; overflow: visible; }
  .die .num { font: 800 30px system-ui, sans-serif; fill: #fff; text-anchor: middle; dominant-baseline: central; paint-order: stroke; stroke: #0007; stroke-width: 3px; }
  .die.d100 .num, .die.big .num { font-size: 24px; }
  .die.rolling { animation: toss var(--dur, 1.1s) cubic-bezier(.3,.7,.4,1) both; }
  .die.rolling svg { animation: tumble var(--dur, 1.1s) cubic-bezier(.25,.6,.3,1) both; }
  .die.landed svg { animation: land .35s ease-out; }
  .die.max svg polygon.body, .die.max svg rect.body { stroke: var(--good); stroke-width: 4; }
  .die.min svg polygon.body, .die.min svg rect.body { stroke: var(--bad); stroke-width: 4; }
  @keyframes toss {
    0% { transform: translate(var(--sx), 90px) scale(.6); }
    45% { transform: translate(calc(var(--sx) * .3), -70px) scale(1.25); }
    70% { transform: translate(0, 12px) scale(.95); }
    85% { transform: translate(0, -14px) scale(1.03); }
    100% { transform: translate(0, 0) scale(1); }
  }
  @keyframes tumble {
    0% { transform: rotateX(0) rotateY(0) rotateZ(0); }
    100% { transform: rotateX(var(--rx)) rotateY(var(--ry)) rotateZ(var(--rz)); }
  }
  @keyframes land { 0% { transform: scale(1.18); } 100% { transform: scale(1); } }

  .total { display: flex; flex-wrap: wrap; align-items: baseline; gap: 14px; margin-top: 14px; justify-content: center; }
  .total .sum { font-size: 3rem; font-weight: 800; color: var(--accent); line-height: 1; }
  .total .detail { color: var(--muted); font-family: ui-monospace, monospace; font-size: .9rem; text-align: center; }

  #history { list-style: none; margin: 0; padding: 0; max-height: 240px; overflow: auto; }
  #history li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 4px; border-bottom: 1px solid #ffffff12; font-size: .92rem; }
  #history li b { color: var(--accent); font-size: 1.05rem; }
  #history .f { color: var(--muted); font-family: ui-monospace, monospace; }
  @media (prefers-reduced-motion: reduce) { .die.rolling, .die.rolling svg { animation-duration: .01s; } }
</style>
</head>
<body>
<main>
  <h1>🎲 Würfel<span>-Roller</span></h1>

  <section class="panel">
    <h2>Würfel wählen &amp; kombinieren</h2>
    <div class="picker" id="picker"></div>
    <div class="row">
      <div class="mod">
        Modifikator
        <div class="stepper">
          <button id="modMinus" aria-label="Modifikator verringern">−</button>
          <output id="modVal">+0</output>
          <button id="modPlus" aria-label="Modifikator erhöhen">+</button>
        </div>
      </div>
      <div class="formula" id="formula"></div>
      <div class="btns">
        <button class="sub" id="reset">Zurücksetzen</button>
        <button class="main" id="roll">Würfeln!</button>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="stage" id="stage"><span class="placeholder">Wähle Würfel und drücke „Würfeln!“</span></div>
    <div class="total" id="total" hidden>
      <div class="sum" id="sum"></div>
      <div class="detail" id="detail"></div>
    </div>
  </section>

  <section class="panel">
    <h2>Verlauf</h2>
    <ul id="history"></ul>
  </section>
</main>

<script>
(() => {
  const SIDES = [4, 6, 8, 10, 12, 20, 100];
  const MAX_PER_TYPE = 20;

  // Form jedes Würfels als SVG (viewBox 0 0 100 100): Hauptumriss + Facettenlinien.
  const SHAPES = {
    4:   { poly: "50,6 95,88 5,88", lines: [[50,6,50,60],[5,88,50,60],[95,88,50,60]], ty: 62, color: "#ef4444" },
    6:   { rect: true, lines: [], ty: 50, color: "#3b82f6" },
    8:   { poly: "50,3 93,50 50,97 7,50", lines: [[7,50,93,50],[50,3,30,50],[50,3,70,50],[50,97,30,50],[50,97,70,50]], ty: 50, color: "#10b981" },
    10:  { poly: "50,3 92,38 50,97 8,38", lines: [[8,38,92,38],[50,3,50,38],[50,97,30,38],[50,97,70,38]], ty: 48, color: "#a855f7" },
    12:  { poly: "50,4 96,37 78,92 22,92 4,37", lines: [[50,4,50,28],[96,37,72,42],[78,92,66,66],[22,92,34,66],[4,37,28,42],[28,42,50,28],[50,28,72,42],[72,42,66,66],[66,66,34,66],[34,66,28,42]], ty: 53, color: "#f59e0b" },
    20:  { poly: "50,3 93,27 93,73 50,97 7,73 7,27", lines: [[50,3,50,28],[93,27,72,62],[93,73,72,62],[50,97,72,62],[50,97,28,62],[7,73,28,62],[7,27,28,62],[50,28,28,62],[50,28,72,62],[28,62,72,62]], ty: 52, color: "#06b6d4" },
    100: { poly: "50,3 80,12 97,38 97,62 80,88 50,97 20,88 3,62 3,38 20,12", lines: [[50,3,50,97],[3,38,97,62],[97,38,3,62]], ty: 50, color: "#ec4899" }
  };

  const $ = id => document.getElementById(id);
  const counts = Object.fromEntries(SIDES.map(s => [s, 0]));
  let modifier = 0, busy = false;
  const history = [];

  // Fairer Zufall über crypto (ohne Modulo-Verzerrung)
  function randInt(n) {
    const lim = Math.floor(0x100000000 / n) * n;
    const buf = new Uint32Array(1);
    do { crypto.getRandomValues(buf); } while (buf[0] >= lim);
    return (buf[0] % n) + 1;
  }
  const rand = (a, b) => a + Math.random() * (b - a);

  function dieSVG(sides, text) {
    const s = SHAPES[sides];
    const shade = `<defs><linearGradient id="g${sides}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".45" stop-color="${s.color}"/>
      <stop offset="1" stop-color="#000" stop-opacity=".45"/></linearGradient></defs>`;
    const body = s.rect
      ? `<rect class="body" x="8" y="8" width="84" height="84" rx="16" fill="${s.color}" stroke="#0009" stroke-width="2.5"/>
         <rect x="8" y="8" width="84" height="84" rx="16" fill="url(#g${sides})"/>`
      : `<polygon class="body" points="${s.poly}" fill="${s.color}" stroke="#0009" stroke-width="2.5" stroke-linejoin="round"/>
         <polygon points="${s.poly}" fill="url(#g${sides})" stroke-linejoin="round"/>`;
    const lines = s.lines.map(l => `<line x1="${l[0]}" y1="${l[1]}" x2="${l[2]}" y2="${l[3]}" stroke="#0005" stroke-width="1.5"/>`).join("");
    return `<svg viewBox="0 0 100 100">${shade}${body}${lines}<text class="num" x="50" y="${s.ty}">${text}</text></svg>`;
  }

  // ---- Auswahl-UI ----
  function buildPicker() {
    $("picker").innerHTML = SIDES.map(s => `
      <div class="pick" data-s="${s}">
        ${dieSVG(s, "")}
        <div class="name">d${s}</div>
        <div class="stepper">
          <button data-act="dec" aria-label="d${s} weniger">−</button>
          <output id="c${s}">0</output>
          <button data-act="inc" aria-label="d${s} mehr">+</button>
        </div>
      </div>`).join("");
    // Eindeutige Gradient-IDs im Picker vermeiden Kollisionen mit der Bühne -> separate Präfixe
    $("picker").querySelectorAll("linearGradient").forEach(g => g.id = "p" + g.id);
    $("picker").querySelectorAll("[fill^='url']").forEach(e => e.setAttribute("fill", e.getAttribute("fill").replace("#g", "#pg")));
  }
  $("picker").addEventListener("click", e => {
    const btn = e.target.closest("button"); if (!btn) return;
    const s = +btn.closest(".pick").dataset.s;
    counts[s] = Math.max(0, Math.min(MAX_PER_TYPE, counts[s] + (btn.dataset.act === "inc" ? 1 : -1)));
    refresh();
  });
  $("modMinus").onclick = () => { modifier = Math.max(-99, modifier - 1); refresh(); };
  $("modPlus").onclick = () => { modifier = Math.min(99, modifier + 1); refresh(); };
  $("reset").onclick = () => { SIDES.forEach(s => counts[s] = 0); modifier = 0; refresh(); };

  function formulaText() {
    const parts = SIDES.filter(s => counts[s]).map(s => `${counts[s]}d${s}`);
    if (!parts.length) return "";
    let t = parts.join(" + ");
    if (modifier) t += (modifier > 0 ? " + " : " − ") + Math.abs(modifier);
    return t;
  }
  function refresh() {
    SIDES.forEach(s => {
      $("c" + s).textContent = counts[s];
      document.querySelector(`.pick[data-s="${s}"]`).classList.toggle("active", counts[s] > 0);
    });
    $("modVal").textContent = (modifier >= 0 ? "+" : "−") + Math.abs(modifier);
    $("formula").textContent = formulaText();
    $("roll").disabled = busy || !SIDES.some(s => counts[s]);
  }

  // ---- Würfeln ----
  function roll() {
    if (busy) return;
    const dice = [];
    SIDES.forEach(s => { for (let i = 0; i < counts[s]; i++) dice.push({ sides: s, value: randInt(s) }); });
    if (!dice.length) return;
    busy = true; refresh();
    $("total").hidden = true;

    const stage = $("stage");
    stage.innerHTML = "";
    const els = dice.map((d, i) => {
      const el = document.createElement("div");
      el.className = "die rolling" + (d.sides === 100 ? " d100" : "");
      const dur = 0.9 + Math.random() * 0.5 + Math.min(i, 12) * 0.03;
      el.style.setProperty("--dur", dur + "s");
      el.style.setProperty("--sx", rand(-160, 160) + "px");
      el.style.setProperty("--rx", Math.round(rand(2, 5)) * 360 * (Math.random() < .5 ? -1 : 1) + "deg");
      el.style.setProperty("--ry", Math.round(rand(2, 5)) * 360 * (Math.random() < .5 ? -1 : 1) + "deg");
      el.style.setProperty("--rz", Math.round(rand(1, 3)) * 360 * (Math.random() < .5 ? -1 : 1) + "deg");
      el.innerHTML = dieSVG(d.sides, randInt(d.sides));
      stage.appendChild(el);
      return { el, d, dur };
    });

    // Zahlen flackern während des Wurfs, dann landet der echte Wert
    const flicker = setInterval(() => {
      els.forEach(o => { if (!o.done) o.el.querySelector(".num").textContent = randInt(o.d.sides); });
    }, 70);

    let pending = els.length;
    els.forEach(o => {
      setTimeout(() => {
        o.done = true;
        o.el.classList.remove("rolling");
        o.el.classList.add("landed");
        o.el.querySelector(".num").textContent = o.d.value;
        if (o.d.sides > 2 && o.d.value === o.d.sides) o.el.classList.add("max");
        else if (o.d.value === 1) o.el.classList.add("min");
        if (--pending === 0) { clearInterval(flicker); finish(dice); }
      }, o.dur * 1000);
    });
  }

  function finish(dice) {
    const sum = dice.reduce((a, d) => a + d.value, 0) + modifier;
    const detail = SIDES.filter(s => counts[s]).map(s =>
      `d${s}: ${dice.filter(d => d.sides === s).map(d => d.value).join(", ")}`).join("  |  ")
      + (modifier ? `  |  Mod: ${modifier > 0 ? "+" : "−"}${Math.abs(modifier)}` : "");
    $("sum").textContent = sum;
    $("detail").textContent = detail;
    $("total").hidden = false;
    history.unshift({ f: formulaText(), sum, detail });
    if (history.length > 30) history.pop();
    $("history").innerHTML = history.map(h =>
      `<li><span class="f">${h.f}<br><small>${h.detail}</small></span><b>${h.sum}</b></li>`).join("");
    busy = false; refresh();
  }

  $("roll").onclick = roll;
  document.addEventListener("keydown", e => {
    if ((e.code === "Space" || e.code === "Enter") && !(e.target instanceof HTMLButtonElement)) { e.preventDefault(); if (!$("roll").disabled) roll(); }
  });

  buildPicker();
  counts[20] = 1; // sinnvolle Vorauswahl
  refresh();
})();
</script>
</body>
</html>
