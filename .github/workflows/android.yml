name: Android APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Launcher-Icon ersetzen
        run: |
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert icon-512.png -resize ${s}x${s} android/app/src/main/res/mipmap-$n/$f.png || true
            done
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/*.xml
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: wuerfel-roller-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
