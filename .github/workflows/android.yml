name: Android APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - run: node scripts/apply-icons.js
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: wuerfel-roller-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: APK als Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk wuerfel-roller.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest wuerfel-roller.apk --target "$GITHUB_SHA" \
            --title "Würfel-Roller (neuester Build)" --notes "Debug-APK, gebaut aus Commit $GITHUB_SHA"
